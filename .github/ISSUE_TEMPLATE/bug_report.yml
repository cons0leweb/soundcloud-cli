name: Bug report
description: Report a reproducible problem in SoundCloud CLI
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach cookies, OAuth tokens, or HAR files.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Output of soundcloud --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact steps and expected behavior, with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      render: shell
